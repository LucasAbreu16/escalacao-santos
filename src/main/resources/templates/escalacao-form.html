<!DOCTYPE HTML>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Escalação — Copa 2026</title>

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script th:src="@{/js/escalacao.js}" defer></script>

</head>

<body>

    <div class="topbar">

        <div class="brand">

            <span class="brand-badge"></span>

            <span>Copa 2026</span>

            <span class="pill pill-selecao" th:text="${selecaoAtual.label}">Brasil</span>

        </div>

        <div class="topbar-actions">

            <a class="btn btn-sm" th:href="@{/escalacoes}">Voltar</a>

            <a class="btn btn-sm" th:href="@{/logout}">Sair</a>

        </div>

    </div>



    <div class="container-escalacao">

        <div class="steps steps-inline" th:if="${editando != true}">

            <div class="step step-done">

                <span class="step-num">01</span>

                <span>Seleção</span>

            </div>

            <div class="step step-active">

                <span class="step-num">02</span>

                <span>Montar os 11</span>

            </div>

            <div class="step">

                <span class="step-num">03</span>

                <span>Salvar</span>

            </div>

        </div>



        <h1 th:text="${editando == true} ? 'Editar escalação' : 'Nova escalação'">Nova escalação</h1>



        <div class="erro" th:if="${erro}" th:text="${erro}"></div>



        <form th:action="${editando == true} ? @{'/escalacoes/' + ${esc.id} + '/editar'} : @{/escalacoes/nova}" method="post">

            <input type="hidden" name="selecao" th:value="${selecaoAtual.name()}">



            <div class="card form-header-card">

                <div class="form-row">

                    <div>

                        <label class="muted">Nome da escalação</label>

                        <input type="text" name="nome" th:value="${nome != null} ? ${nome} : ${esc.nome}" required>

                    </div>

                    <div>

                        <label class="muted">Formação</label>

                        <select name="formacao">

                            <option th:each="f : ${formacoes}"

                                    th:value="${f.codigo}"

                                    th:text="${f.codigo}"

                                    th:selected="${formacaoSelecionada != null} ? (${formacaoSelecionada} == ${f.codigo}) : (${esc.formacao} == ${f.codigo})">

                            </option>

                        </select>

                    </div>

                </div>

                <div class="counts-bar">

                    <span class="pill">Total <span id="count-total">0/11</span></span>

                    <span class="pill">GOL <span id="count-GOLEIRO">0/1</span></span>

                    <span class="pill">LAT <span id="count-LATERAL">0/2</span></span>

                    <span class="pill">ZAG <span id="count-ZAGUEIRO">0/2</span></span>

                    <span class="pill">MC <span id="count-MEIO_CAMPISTA">0/4</span></span>

                    <span class="pill">ATA <span id="count-ATACANTE">0/2</span></span>

                </div>

            </div>



            <div class="form-layout">

                <div class="field-pitch card">

                    <div class="pitch-grass"></div>

                    <div class="pitch-box pitch-box-top"></div>

                    <div class="pitch-box pitch-box-bottom"></div>

                    <div class="pitch-mid-line"></div>

                    <div class="pitch-circle"></div>

                    <div class="pitch-slots" id="pitch-slots"></div>

                </div>



                <div class="side-panel">

                    <div class="card lineup-card">

                        <h2>Escalados</h2>

                        <div class="lineup-list" id="lineup-list"></div>

                    </div>



                    <div class="card players-panel players-scroll">

                        <h2>Escolher jogadores</h2>

                        <p class="muted empty-players" th:if="${#lists.isEmpty(jogadores)}">

                            Nenhum jogador cadastrado para esta seleção.

                        </p>



                        <div class="posicao-block">

                            <h3>Goleiros</h3>

                            <label class="player-row" th:each="j : ${jogadores}" th:if="${j.posicao.name() == 'GOLEIRO'}">

                                <input type="checkbox" name="jogadorIds" th:value="${j.id}"

                                       th:attr="data-posicao=${j.posicao.name()}"

                                       th:checked="${selecionados.contains(j.id)}">

                                <span class="player-pos pill">GOL</span>

                                <span class="player-name" th:text="${j.nome}"></span>

                            </label>

                        </div>



                        <div class="posicao-block">

                            <h3>Laterais</h3>

                            <label class="player-row" th:each="j : ${jogadores}" th:if="${j.posicao.name() == 'LATERAL'}">

                                <input type="checkbox" name="jogadorIds" th:value="${j.id}"

                                       th:attr="data-posicao=${j.posicao.name()}"

                                       th:checked="${selecionados.contains(j.id)}">

                                <span class="player-pos pill">LAT</span>

                                <span class="player-name" th:text="${j.nome}"></span>

                            </label>

                        </div>



                        <div class="posicao-block">

                            <h3>Zagueiros</h3>

                            <label class="player-row" th:each="j : ${jogadores}" th:if="${j.posicao.name() == 'ZAGUEIRO'}">

                                <input type="checkbox" name="jogadorIds" th:value="${j.id}"

                                       th:attr="data-posicao=${j.posicao.name()}"

                                       th:checked="${selecionados.contains(j.id)}">

                                <span class="player-pos pill">ZAG</span>

                                <span class="player-name" th:text="${j.nome}"></span>

                            </label>

                        </div>



                        <div class="posicao-block">

                            <h3>Meio-campistas</h3>

                            <label class="player-row" th:each="j : ${jogadores}" th:if="${j.posicao.name() == 'MEIO_CAMPISTA'}">

                                <input type="checkbox" name="jogadorIds" th:value="${j.id}"

                                       th:attr="data-posicao=${j.posicao.name()}"

                                       th:checked="${selecionados.contains(j.id)}">

                                <span class="player-pos pill">MC</span>

                                <span class="player-name" th:text="${j.nome}"></span>

                            </label>

                        </div>



                        <div class="posicao-block">

                            <h3>Atacantes</h3>

                            <label class="player-row" th:each="j : ${jogadores}" th:if="${j.posicao.name() == 'ATACANTE'}">

                                <input type="checkbox" name="jogadorIds" th:value="${j.id}"

                                       th:attr="data-posicao=${j.posicao.name()}"

                                       th:checked="${selecionados.contains(j.id)}">

                                <span class="player-pos pill">ATA</span>

                                <span class="player-name" th:text="${j.nome}"></span>

                            </label>

                        </div>

                    </div>



                    <div class="form-actions">

                        <button class="btn btn-primary btn-block" type="submit"

                                th:text="${editando == true} ? 'Salvar alterações' : 'Salvar escalação'">Salvar escalação</button>

                    </div>

                </div>

            </div>

        </form>

    </div>

</body>

</html>
