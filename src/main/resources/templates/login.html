<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login — Copa 2026</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="topbar">
        <div class="brand">
            <span class="brand-badge"></span>
            <span>Copa 2026</span>
        </div>
        <a class="btn btn-sm" th:href="@{/}">Início</a>
    </div>

    <div class="container">
        <div class="card auth-card">
            <h1>Entrar</h1>
            <p class="muted">Acesse suas escalações salvas.</p>

            <div class="erro" th:if="${erro}" th:text="${erro}"></div>
            <div class="muted" th:if="${param.logout}" style="margin-bottom:12px;">Você saiu do sistema.</div>

            <form th:action="@{/login}" method="post">
                <label>Usuário</label>
                <input type="text" name="username" required autofocus>
                <label>Senha</label>
                <input type="password" name="password" required>
                <button class="btn btn-primary" type="submit" style="width:100%;margin-top:8px;">Entrar</button>
            </form>

            <p class="muted" style="margin-top:16px;text-align:center;">
                Não tem conta? <a th:href="@{/cadastro}">Criar conta</a>
            </p>
        </div>
    </div>
</body>
</html>
