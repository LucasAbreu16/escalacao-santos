<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Minhas escalações - Seleção Santástica</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="topbar">
        <div class="brand">
            <span class="brand-badge"></span>
            <span>Seleção Santástica</span>
        </div>
        <div class="topbar-actions">
            <a class="btn btn-sm" th:href="@{/escalacoes/nova}">Nova escalação</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-sm">Sair</button>
            </form>
        </div>
    </div>

    <div class="container-wide">
        <div class="page-header">
            <h1>Minhas escalações</h1>
        </div>

        <div th:if="${#lists.isEmpty(escalacoes)}" class="card empty-state">
            <p>Você ainda não criou nenhuma escalação.</p>
            <p><a class="btn btn-primary" th:href="@{/escalacoes/nova}">Criar primeira escalação</a></p>
        </div>

        <div class="escalacao-list" th:if="${!#lists.isEmpty(escalacoes)}">
            <div class="escalacao-card" th:each="e : ${escalacoes}">
                <div class="escalacao-card-info">
                    <h3 th:text="${e.nome}">Nome</h3>
                    <span class="pill" th:text="${e.formacao}">4-4-2</span>
                </div>
                <div class="escalacao-card-actions">
                    <a class="btn btn-sm" th:href="@{'/escalacoes/' + ${e.id} + '/editar'}">Editar</a>
                    <form th:action="@{'/escalacoes/' + ${e.id} + '/excluir'}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
